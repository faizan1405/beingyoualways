<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=block" rel="stylesheet"><link rel="stylesheet" href="../shared/slide.css"><style>
.copy{position:relative;z-index:2;width:860px}
.blocks{margin-top:70px;display:flex;flex-direction:column;gap:0}
.blk{padding:40px 0;border-top:2px solid var(--line)}
.blk:last-child{border-bottom:2px solid var(--line)}
.blk .label{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:14px 16px;margin-top:4px}
.chip{font-size:42px;font-weight:600;padding:12px 28px;border-radius:999px;background:var(--soft);border:2px solid var(--line);color:var(--green)}
.ticks{list-style:none;display:flex;flex-direction:column;gap:14px}
.ticks li{font-size:46px;font-weight:600;display:flex;gap:22px;align-items:center}
.ticks li:before{content:"";flex:none;width:22px;height:22px;border-radius:50%;background:var(--terra)}
.pack{position:absolute;right:150px;bottom:200px;height:1120px;filter:drop-shadow(0 40px 40px rgba(37,39,34,.16)) drop-shadow(0 6px 8px rgba(37,39,34,.12))}
.halo{position:absolute;right:60px;bottom:140px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,#eef1ec 0,#f6f7f5 55%,#fff 72%)}
.plant{position:absolute;right:120px;top:110px;font-size:30px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--green);border:2px solid var(--green);padding:14px 26px;border-radius:999px}
</style></head><body><div class="slide">
<div class="copy">
 <div class="eyebrow">Face Serum · 30 ml</div>
 <h1>Who is it<br>for?</h1>
 <div class="blocks">
  <div class="blk"><div class="label">Made for</div>
   <div class="chips"><span class="chip">Pigmentation &amp; spots</span><span class="chip">Uneven skin tone</span><span class="chip">Dark circles</span></div></div>
  <div class="blk"><div class="label">Skin types</div>
   <div class="chips"><span class="chip">Dull, dry skin</span><span class="chip">Acne-prone skin</span></div></div>
  <div class="blk"><div class="label">What it does</div>
   <ul class="ticks"><li>Evens the look of skin tone</li><li>Brightens for a natural glow</li><li>Keeps skin hydrated</li></ul></div>
 </div>
</div>
<div class="plant">Plant based</div>
<div class="halo"></div>
<img class="pack" src="img/bottle.png" alt="">
<div class="brand">Being You<small>Always</small></div><div class="pg">02 / 04</div>
</div></body></html>
